name: Idiotinator APK
on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Run optional emulator startup test after APK upload
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/idiotinator-diagnostics.yml'
      - '**/*.md'
permissions:
  contents: read
concurrency:
  group: idiotinator-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'false'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ inputs.smoke_test && 'arm64-v8a,x86_64' || 'arm64-v8a' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      # Must precede setup-node and setup-java: /opt/hostedtoolcache is where
      # those install. The Hexagon SDK adds ~3.1 GB on top of a from-source build.
      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Restore enriched-markdown native assets
        # A cached node_modules can hold a failed download. Run directly, the script
        # reads the app's "enriched-markdown" config only through INIT_CWD.
        run: INIT_CWD="$GITHUB_WORKSPACE" node node_modules/react-native-enriched-markdown/postinstall.mjs

      - name: Test adaptive reasoning
        run: yarn test --runInBand --coverage=false src/utils/__tests__/idiotinatorReasoning.test.ts

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Gradle task cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-idiotinator-gradle-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-idiotinator-gradle-

      - name: Create dummy google-services.json for CI
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.personal.idiotinator.next"
                }
              },
              "api_key": [{
                "current_key": "dummy-api-key-for-ci-builds"
              }]
            }]
          }
          EOL

      - name: Create dummy .env file for CI
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com

          # PalsHub/Supabase Configuration
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com

          # App Configuration
          APP_URL=pocketpal://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      - name: Apply standalone package configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('// Cloud benchmark configuration intentionally omitted in standalone preview.', 'apply plugin: "com.google.gms.google-services"')
          s = s.replace('applicationId "com.personal.idiotinator.next"', 'applicationId "com.personal.idiotinator.next"\n        resValue "string", "build_config_package", "com.pocketpal"')
          s = s.replace('versionCode 161', 'versionCode 162').replace('versionName "0.1.4"', 'versionName "0.1.5"')
          if os.environ['ORG_GRADLE_PROJECT_reactNativeArchitectures'] == 'arm64-v8a':
              s = s.replace('abiFilters "arm64-v8a", "x86_64"', 'abiFilters "arm64-v8a"')
          p.write_text(s)
          PY

      - name: Build Android Release
        working-directory: android
        run: bash gradlew assembleProdRelease --stacktrace --build-cache --console=plain -PrnllamaBuildFromSource=false -PreactNativeArchitectures="$ORG_GRADLE_PROJECT_reactNativeArchitectures"

      - name: Verify prod APK has no automation-bridge code (DCE sanity check)
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/prod/release/app-prod-release.apk
          echo "Checking bundle inside $APK for E2E markers..."
          WORK=$(mktemp -d)
          unzip -p "$APK" assets/index.android.bundle > "$WORK/bundle" || {
            echo "FAIL: could not extract assets/index.android.bundle from APK"
            exit 1
          }
          MARKERS=(
            'AUTOMATION_BRIDGE'
            'memory-snapshot-label'
            'memory-snapshot-result'
            'BENCH_RUN_MATRIX'
            'bench-runner-screen-status'
            'ASR_AUTOMATION_STATE'
            'VOICE_AUTOMATION_STATE'
            'IAP_API_BASE_OVERRIDE'
            'IAP_FAKE_STORE'
            'PLUS_SHIP_OVERRIDE'
            'PLUS_GATE_PROBE'
          )
          FAIL=0
          for m in "${MARKERS[@]}"; do
            if grep -q -F "$m" "$WORK/bundle"; then
              echo "FAIL: prod bundle contains automation marker: $m"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "The automation bridge was not DCE-stripped from the prod build."
            echo "Check that __E2E__ is being replaced at build time by babel-plugin-transform-define."
            echo "See src/__automation__/README.md for the DCE contract."
            exit 1
          fi
          echo "OK: prod bundle contains zero automation markers."

      - name: Verify the Plus store gate
        run: scripts/verify-plus-gate.sh android/app/build/outputs/apk/prod/release/app-prod-release.apk --ungated

      - name: Verify APK architectures
        run: |
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/prod/release/app-prod-release.apk') as apk:
              actual = {p.split('/')[1] for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')}
          expected = set(os.environ['ORG_GRADLE_PROJECT_reactNativeArchitectures'].split(','))
          print('APK architectures:', actual)
          assert actual == expected, (actual, expected)
          PY

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/prod/release/app-prod-release.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_test
      - name: Verify Android launch on emulator
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 600
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash scripts/idiotinator-smoke.sh
      - name: Upload startup logs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.smoke_test
        uses: actions/upload-artifact@v4
        with:
          name: startup-log
          path: startup-log.txt
          if-no-files-found: ignore
