name: Idiotinator APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/idiotinator-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --channel=3 --licenses
          set -o pipefail
          "$SDKMANAGER" --channel=3 --list | grep -E "platforms;android-37|build-tools;37|ndk;27.3" || true
          "$SDKMANAGER" --channel=3 --install "platforms;android-37" "build-tools;37.0.0" "ndk;27.3.13750724"
      - name: Install JavaScript dependencies
        run: |
          touch .env
          corepack enable
          yarn install --frozen-lockfile
      - name: Build standalone release APK
        working-directory: android
        run: bash gradlew assembleProdRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Idiotinator-0.1.4-preview
          path: android/app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
