name: Idiotinator APK
on:
  push:
    branches: [main]
    paths: ['.github/build-request.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: idiotinator-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: 'arm64-v8a,x86_64'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Must precede setup-node and setup-java: /opt/hostedtoolcache is where
      # those install. The Hexagon SDK adds ~3.1 GB on top of a from-source build.
      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json', 'yarn.lock', 'patches/**') }}

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Restore enriched-markdown native assets
        # A cached node_modules can hold a failed download. Run directly, the script
        # reads the app's "enriched-markdown" config only through INIT_CWD.
        run: INIT_CWD="$GITHUB_WORKSPACE" node node_modules/react-native-enriched-markdown/postinstall.mjs

      - name: TypeScript regression check
        run: yarn tsc --noEmit

      - name: Test adaptive learning safety
        run: yarn test --runInBand --coverage=false src/services/__tests__/adaptiveLearning.test.ts src/database/__tests__/schema.test.ts
      - name: Test adaptive reasoning
        run: yarn test --runInBand --coverage=false src/utils/__tests__/diagnosticStatus.test.ts src/components/MarkdownView/__tests__/normalizeBreakTags.test.ts src/utils/__tests__/idiotinatorReasoning.test.ts src/components/MarkdownView/__tests__/invariants.test.ts src/components/MarkdownView/__tests__/MarkdownView.test.tsx

      - name: Shared PocketPal functional regression suites
        run: yarn test --runInBand --coverage=false src/utils/__tests__/hfDownloadLink.test.ts src/utils/__tests__/hfResolve.test.ts src/services/downloads/__tests__/DownloadManager.test.ts src/utils/__tests__/deviceSelection.test.ts src/components/ChatInput/__tests__ src/hooks/__tests__/useVoiceCapture.test.ts src/hooks/__tests__/useVoiceMode.test.ts src/store/__tests__/VoiceModeStore.test.ts src/components/VoiceModeView/__tests__
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Gradle task cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-idiotinator-gradle-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-idiotinator-gradle-

      - name: Create dummy google-services.json for CI
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.personal.idiotinator.next"
                }
              },
              "api_key": [{
                "current_key": "dummy-api-key-for-ci-builds"
              }]
            }]
          }
          EOL

      - name: Create dummy .env file for CI
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com

          # PalsHub/Supabase Configuration
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com

          # App Configuration
          APP_URL=pocketpal://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      - name: Apply standalone package configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('// Cloud benchmark configuration intentionally omitted in standalone preview.', 'apply plugin: "com.google.gms.google-services"')
          s = s.replace('applicationId "com.personal.idiotinator.next"', 'applicationId "com.personal.idiotinator.next"\n        resValue "string", "build_config_package", "com.pocketpal"')
          assert 'versionCode 169' in s and 'versionName "0.2.0"' in s, 'Unexpected release version'
          if os.environ['ORG_GRADLE_PROJECT_reactNativeArchitectures'] == 'arm64-v8a':
              s = s.replace('abiFilters "arm64-v8a", "x86_64"', 'abiFilters "arm64-v8a"')
          p.write_text(s)
          PY

      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk
      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          max-size: 4G
      - name: Restore native compilation cache
        uses: actions/cache@v4
        with:
          path: node_modules/llama.rn/android/.cxx
          key: ${{ runner.os }}-llama-native-v2-arm64-v8a-x86_64-${{ hashFiles('yarn.lock', 'patches/llama.rn*', 'android/build.gradle', 'android/gradle.properties', '.github/actions/setup-hexagon-sdk/action.yml') }}
      - name: Compile patched native engine separately
        working-directory: android
        run: |
          set -euo pipefail
          bash gradlew :llama.rn:assembleRelease --stacktrace --build-cache --console=plain -PrnllamaBuildFromSource=true -PreactNativeArchitectures="$ORG_GRADLE_PROJECT_reactNativeArchitectures"
      - name: Package versioned native engine
        id: engine
        run: |
          set -euo pipefail
          mkdir -p native-engine
          mapfile -t aars < <(find node_modules/llama.rn/android/build/outputs/aar -maxdepth 1 -name '*release.aar')
          test "${#aars[@]}" -eq 1
          cp "${aars[0]}" native-engine/engine.aar
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile, os
          root = pathlib.Path('native-engine')
          manifest = json.loads(pathlib.Path('scripts/android-payload-manifest.json').read_text())
          with zipfile.ZipFile(root/'engine.aar') as aar:
              names = set(aar.namelist())
              for abi in manifest['abis']:
                  for lib in abi['requiredLibs']:
                      assert f"jni/{abi['abi']}/{lib}" in names, (abi['abi'], lib)
          for asset in manifest['abis'][0]['requiredAssets']:
              name = pathlib.Path(asset).name
              source = pathlib.Path('node_modules/llama.rn/bin/arm64-v8a')/name
              assert source.is_file(), source
              (root/name).write_bytes(source.read_bytes())
          inputs = [pathlib.Path(p) for p in ['yarn.lock','package.json','android/build.gradle','android/gradle.properties','android/gradle/wrapper/gradle-wrapper.properties','.github/actions/setup-hexagon-sdk/action.yml','.github/workflows/idiotinator-apk.yml','scripts/android-payload-manifest.json']]
          inputs += sorted(pathlib.Path('patches').glob('llama.rn*'))
          fingerprint = hashlib.sha256()
          for p in inputs:
              fingerprint.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          fingerprint.update(os.environ['ORG_GRADLE_PROJECT_reactNativeArchitectures'].encode())
          version = fingerprint.hexdigest()
          metadata = {'schema':1,'fingerprint':version,'source_commit':os.environ['GITHUB_SHA'],'architectures':['arm64-v8a','x86_64'],'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}}
          (root/'manifest.json').write_text(json.dumps(metadata,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('version='+version+'\n')
          PY
      - name: Upload versioned native engine
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-${{ steps.engine.outputs.version }}
          path: native-engine/
          if-no-files-found: error
          retention-days: 90
      - name: Native downloader regression tests
        working-directory: android
        run: bash gradlew :app:testProdDebugUnitTest --tests 'com.pocketpal.download.*' --stacktrace --build-cache --console=plain -PrnllamaBuildFromSource=true -PreactNativeArchitectures="$ORG_GRADLE_PROJECT_reactNativeArchitectures"

      - name: Build Android Release
        working-directory: android
        run: bash gradlew assembleProdRelease --stacktrace --build-cache --console=plain -PrnllamaBuildFromSource=true -PreactNativeArchitectures="$ORG_GRADLE_PROJECT_reactNativeArchitectures"

      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats; else echo 'ccache setup was not reached'; fi

      - name: Verify prod APK has no automation-bridge code (DCE sanity check)
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/prod/release/app-prod-release.apk
          echo "Checking bundle inside $APK for E2E markers..."
          WORK=$(mktemp -d)
          unzip -p "$APK" assets/index.android.bundle > "$WORK/bundle" || {
            echo "FAIL: could not extract assets/index.android.bundle from APK"
            exit 1
          }
          MARKERS=(
            'AUTOMATION_BRIDGE'
            'memory-snapshot-label'
            'memory-snapshot-result'
            'BENCH_RUN_MATRIX'
            'bench-runner-screen-status'
            'ASR_AUTOMATION_STATE'
            'VOICE_AUTOMATION_STATE'
            'IAP_API_BASE_OVERRIDE'
            'IAP_FAKE_STORE'
            'PLUS_SHIP_OVERRIDE'
            'PLUS_GATE_PROBE'
          )
          FAIL=0
          for m in "${MARKERS[@]}"; do
            if grep -q -F "$m" "$WORK/bundle"; then
              echo "FAIL: prod bundle contains automation marker: $m"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "The automation bridge was not DCE-stripped from the prod build."
            echo "Check that __E2E__ is being replaced at build time by babel-plugin-transform-define."
            echo "See src/__automation__/README.md for the DCE contract."
            exit 1
          fi
          echo "OK: prod bundle contains zero automation markers."

      - name: Verify the Plus store gate
        run: scripts/verify-plus-gate.sh android/app/build/outputs/apk/prod/release/app-prod-release.apk --ungated

      - name: Verify APK release metadata
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/prod/release/app-prod-release.apk > apk-badging.txt
          grep -F "versionCode='169'" apk-badging.txt
          grep -F "versionName='0.2.0'" apk-badging.txt
      - name: Verify APK architectures
        run: |
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/prod/release/app-prod-release.apk') as apk:
              actual = {p.split('/')[1] for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')}
          expected = set(os.environ['ORG_GRADLE_PROJECT_reactNativeArchitectures'].split(','))
          print('APK architectures:', actual)
          assert actual == expected, (actual, expected)
          PY

      - name: Verify native payload
        run: |
          node -e 'const fs=require("fs"); const m=require("./scripts/android-payload-manifest.json"); m.abis=m.abis.filter(a=>process.env.ORG_GRADLE_PROJECT_reactNativeArchitectures.split(",").includes(a.abi)); fs.writeFileSync("scripts/idiotinator-payload-ci.json",JSON.stringify(m));'
          node scripts/verify-android-payload.js --manifest scripts/idiotinator-payload-ci.json --apk android/app/build/outputs/apk/prod/release/app-prod-release.apk --report payload-report.txt
      - name: Upload native payload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload-report
          path: payload-report.txt
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Verify Android launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 1500
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash scripts/idiotinator-smoke.sh
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-log
          path: startup-log.txt
          if-no-files-found: ignore

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/prod/release/app-prod-release.apk

