name: Idiotinator APK Diagnostics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Numeric Actions run ID of a successful Idiotinator APK build
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: android/app/build/outputs/apk/prod/release
      - name: Detect KVM availability
        id: accel
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm || true; fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'mode=on' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=off' >> "$GITHUB_OUTPUT"
            echo 'KVM unavailable; using software emulation'
          fi
      - name: Launch existing APK and collect logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 1500
          disable-linux-hw-accel: ${{ steps.accel.outputs.mode == 'off' }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/idiotinator-smoke.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics
          path: startup-log.txt
          if-no-files-found: warn
